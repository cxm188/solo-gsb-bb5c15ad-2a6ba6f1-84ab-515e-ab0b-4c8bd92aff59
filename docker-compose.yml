services:
  relic-case-api:
    build: .
    image: relic-case-changepoint-api:latest
    container_name: relic-case-api
    ports:
      - "8080:8080"
    environment:
      CASE_PORT: "8080"
      CASE_PENALTY: "4.0"
      CASE_MIN_SEGMENT_SIZE: "3"
      CASE_ANCHOR_TOLERANCE: "300"
    volumes:
      - case-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  case-data:
